metadata:
  title: Numerical Simulation of Turbulent Flow in a Channel
  doi: 10.1234/example.2024.001
governing_equations:
- equation: \frac{\partial u_i}{\partial t} + u_j \frac{\partial u_i}{\partial x_j}
    = -\frac{1}{\rho}\frac{\partial p}{\partial x_i} + \nu \frac{\partial^2 u_i}{\partial
    x_j^2}
  description: 待定
- equation: \frac{\partial u_i}{\partial x_i} = 0
  description: 待定
variables:
- symbol: velocity
  description: is
  unit: m/s
- symbol: time
  description: is
  unit: s
- symbol: pressure
  description: is
  unit: Pa
- symbol: density
  description: is
  unit: kg/m³
- symbol: viscosity
  description: is kinematic
  unit: m²/s
boundary_conditions:
  spatial:
  - '2.2 Boundary Conditions

    At the inlet, a uniform velocity profile is prescribed: $u = U_0 = 1.0$ m/s.'
  - '2.2 Boundary Conditions

    At the inlet, a uniform velocity profile is prescribed: $u = U_0 = 1.0$ m/s.

    At the outlet, a zero gradient boundary condition is applied.'
  - 'At the inlet, a uniform velocity profile is prescribed: $u = U_0 = 1.0$ m/s.

    At the outlet, a zero gradient boundary condition is applied.

    At the walls, no-slip boundary condition is imposed: $u = 0$.'
  - 'At the outlet, a zero gradient boundary condition is applied.

    At the walls, no-slip boundary condition is imposed: $u = 0$.'
